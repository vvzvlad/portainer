name: Build image

on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch: {}

# Two quick pushes to develop start two runs that race, and this build is long
# (Go + pnpm), so the overlap window is wide. The older run can finish last and
# publish its `latest` after the newer one, leaving the registry pointing at the
# previous commit on a perfectly green build. Serialising per ref makes the last
# push win. Cancellation stays off on purpose — the older run also publishes the
# version tag, and cancelling it would discard that image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Own Gitea registry. The image name intentionally keeps the historical
  # `portainer-ce` and does not follow the repo name (`portainer`).
  IMAGE: gitea.vvzvlad.xyz/projects/portainer-ce

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # No `packages: write`: that scope is GitHub-specific and has no effect
      # on Gitea Actions. The registry push authenticates with REGISTRY_TOKEN.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install client dependencies
        # CI forces pnpm into --frozen-lockfile, which fails with
        # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH because the committed lockfile lacks
        # the pnpmfileChecksum for the configDependencies in package.json.
        # Reconcile the lockfile explicitly; the later frozen install in
        # `make client-deps` then finds a matching lockfile. pnpm ignores the
        # npm_config_frozen_lockfile env var, so an explicit flag is required.
        run: pnpm install --no-frozen-lockfile

      - name: Build client and server
        env:
          SKIP_GO_GET: "true"
          CONTAINER_IMAGE_TAG: ${{ steps.ver.outputs.version }}
          BUILDNUMBER: ${{ github.run_number }}
          # Pin the embedded commit to the full SHA so it matches the image
          # GIT_COMMIT build-arg and does not depend on the shallow checkout.
          GIT_COMMIT_HASH: ${{ github.sha }}
        # ENV=production selects webpack/webpack.production.js (minified bundle),
        # matching the official CE image; the Makefile default is development.
        run: make build-all ENV=production

      - name: Ensure storybook directory exists
        # make build-all does not produce dist/storybook, but alpine.Dockerfile
        # has `COPY dist/storybook* /storybook/`; without a match the docker build fails.
        run: mkdir -p dist/storybook

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Gitea container registry
        uses: docker/login-action@v4
        with:
          registry: gitea.vvzvlad.xyz
          username: ${{ github.repository_owner }}
          # PAT with `write:package`. The built-in GITEA_TOKEN has no package
          # scope, so it cannot push images.
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push image (linux/amd64, alpine base)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/linux/alpine.Dockerfile
          platforms: linux/amd64
          # Equivalent of `docker build --pull`. The runner is self-hosted with a
          # long-lived daemon, so without this the alpine base image is served from
          # a local cache that can be months old and carries an unpatched system
          # layer into every build.
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
